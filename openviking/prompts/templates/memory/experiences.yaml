memory_type: experiences
description: |
  A generalizable, reusable failure-repair experience distilled from agent execution.
  It is read by the skill experience loader, so the content must expose clear applicability,
  the minimal corrective reminder, and anti-patterns. It is not a full workflow or a case log.

directory: "viking://user/{{ user_space }}/memories/experiences"
filename_template: "{{ experience_name }}.md"
enabled: true
operation_mode: "upsert"
agent_only: true
content_template: |
  ## Situation
  {{ situation }}

  ## Reminder
  {{ reminder }}

  ## Procedure
  {{ procedure }}

  ## Verification
  {{ verification }}

  ## Fallback
  {{ fallback }}

  ## Anti-pattern
  {{ anti_pattern }}

fields:
  - name: experience_name
    type: string
    description: |
      Name the generalizable failure-repair pattern, not the specific instance.
      Must be written in {{ language }}.
      {% if language == 'en' %}Use lowercase snake_case, max 5 words.{% else %}Use a concise noun phrase, max 15 characters.{% endif %}
      Good: "verify_before_irreversible_action", "missing_required_output", "关键校验遗漏".
    merge_op: immutable

  - name: situation
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.

      Write only the bullet body for `## Situation`; the storage template adds the heading.
      The skill loader shows this section in search results and may load the whole file with
      `read_experience`, so it must be understandable without trigger_code.
      - Applies when: <runtime-visible task/user/tool-result situation where this lesson matters>
      - Does not apply when: <closest nearby but non-applicable task pattern; do not use
        temporal stage wording such as before final_response or while still reading/writing>
      - Evidence binding: <which observation or evidence supports applying the rule>
      - Decision boundary: <the earliest reusable point where the reminder changes behavior>

      Rules:
      - Failure prevention or observed failure recovery only. A successful trajectory is eligible
        only when its structured recovery evidence is `observed_recovered` and the runtime trace
        proves the failed boundary, an actually executed alternative, and the verified recovered
        result. Do not output generic positive workflows, full SOPs, success-path summaries, or
        case transcripts.
      - One experience covers one reusable root failure pattern. Split unrelated failures; keep
        coupled symptoms together only when they share the same evidence, boundary, and repair.
        Do not compress several independently testable omissions into one reminder. A multi-step
        procedure is valid only when every step implements the same single behavior change.
      - Do not merge failures merely because they share an evaluator label such as missing
        requirement. Merge only when first runtime divergence, decisive evidence, applicability,
        and minimal repair action are compatible.
      - Reject generic slogans such as "check all requirements", "ensure full compliance", or
        "review carefully". Replace them with one concrete runtime boundary, one observable or
        independently verifiable fact, and one corrective action.
      - Do not disguise the same broad rule as "extract/map/cross-reference all explicit user
        requirements" or a 100% coverage checklist. Requirements with different evidence,
        decision boundaries, or repairs are different failure patterns and must not be bundled.
      - Focus on the first materially outcome-changing mistake and the minimal prevention or
        recovery action at that boundary.
      - Treat trajectory memories as factual evidence, not authoritative conclusions. Inspect the
        chronological `Execution`, factual `Evaluation`, and final `Result`. Locate the earliest
        observable agent decision or missing check that separates the produced result from the
        required result; do not infer hidden reasoning.
      - When both successful and non-successful trajectories are available for the same or
        similar task pattern, compare them before writing an experience: find which
        observation, decision, action, verification, or output differs at the first material
        divergence.
      - Do not copy any trajectory wording directly into an experience. Re-check the original
        runtime evidence, injected experience effects, existing experiences, and these rules
        before writing an injectable reminder.
      - For non-success trajectories, create or update an experience only when the evidence
        supports a narrow runtime reminder that would likely prevent or recover from the first
        materially outcome-changing mistake.
      - For a successful trajectory marked `observed_recovered`, create or update at most one
        narrow recovery lesson for each independently evidenced failed boundary. Preserve only the
        observed trigger, compatible alternative that actually ran, unchanged task constraint, and
        verification. Do not extract the surrounding successful workflow.
      - For ordinary successful, case-specific, already-covered, unsupported, or not-preventable
        trajectories, output no experience changes.
      - If a loaded experience was causal and marked over-broad, misleading, or too weak, update
        that existing experience; otherwise do not patch irrelevant loaded experiences.
      - Do not present advisory signals as runtime observations or causal facts. Derive every
        behavior claim from runtime evidence or direct external evidence; otherwise keep the
        cause unknown.
      - Bind every reminder to a concrete evidence source and decision boundary. Advisory signals
        may guide inspection but cannot independently justify an experience.
      - Treat a `rollout_evaluation` direct source as authoritative evidence only for the observed
        outcome and requirement compliance. It may trigger inspection, but it cannot by itself
        justify an experience. Create or update an experience only when the trajectory also exposes
        an agent-controllable observation, decision, action, verification, or output boundary and a
        concrete replacement behavior.
      - Output no experience change when the failure is caused only by missing required input,
        an unavailable external service, tool or infrastructure failure, or an evaluator-only
        requirement that is not present in the user request, authoritative source, or runtime
        contract. Do not turn these failures into extra checks, artifacts, or hidden requirements.
      - When the internal cause is unknown, output no experience change. Do not replace a missing
        causal explanation with a generic prevention or verification reminder.
      - Preserve the nearest correct behavior and state the closest non-applicable situation so
        the reminder does not block valid paths in other domains.
      - `Does not apply when` must describe a task-pattern mismatch, not the current temporal
        stage. Do not write conditions such as "still reading", "before final response", "before
        writes complete", or "not yet at the final_response"; the skill loader may read the
        experience at task start even when the reminder applies at a later boundary.
      - Do not encode dataset-specific values, IDs, amounts, paths, or domain names in the reusable
        rule; express the lesson as an observable condition, decision boundary, and behavior delta.
        In particular, replace example numbers, date/month ranges, source workbook tab names, and
        helper script filenames with values read from the runtime request, source, or available tools.
        Prefer semantic capabilities and source roles over exact tool identifiers when the tool name
        is not itself part of the runtime contract.
      - Apply a transfer test before writing: replace the source task's entities, dates, amounts,
        filenames, and other instance values with different valid values from the same task family.
        The Situation discriminator, decision rule, actions, verification relationship, and fallback
        must still be correct. If the lesson only makes sense for the original instance, output no
        experience change instead of paraphrasing that task.
      - Do not promote a retry count, polling interval, timeout window, sample size, spot-check count,
        or other control number observed in one trajectory into a permanent rule. Bind it to an
        explicit future user/tool policy when one exists; otherwise use a bounded retry with an
        observable stop condition and verify the decisive result directly.
      - Never create Experience for internal sandbox trace capture, post-run trace retrieval,
        evaluator transport, orchestration bookkeeping, or similar platform infrastructure failures.
        These are operational incidents, not reusable user-task decisions.
      - Determine source eligibility before generalizing wording. If the trajectory's actual failure
        is an internal execution, trace, evaluation-transport, or orchestration incident, output no
        change even when it could be paraphrased as a generic external-service or artifact workflow.
        A real user-requested asynchronous export remains eligible only when the agent can observe
        and change a user-task action under the service's public runtime contract.
      - Before creating a new Experience, compare its root decision, evidence source, decision
        boundary, corrective action, verification relationship, and fallback with candidate
        Experiences. Update the single compatible candidate instead of creating a synonym. Keep
        separate Experiences only when one of those dimensions materially conflicts.
      - Never infer output language solely from audience geography. Follow explicit language
        instructions first; otherwise preserve the user's language choice or ask when the choice
        materially affects the deliverable. Do not describe any audience as "implying" a language.
        Locale may affect conventions without selecting language.
      - Verification may use an in-context requirement map or any available scratch mechanism, but
        do not mandate a fixed helper filename, visible intermediate file, or extra deliverable unless
        the runtime user request or tool contract explicitly requires it.
      - For same-tool near misses, `Situation` and `Anti-pattern` must state the discriminator
        that separates the wrong candidate from the correct one.
      - If a required source is unavailable, prefer a verifiable authoritative alternative. If no
        substitute can be verified, state the limitation; do not fill factual gaps from unchecked
        general knowledge.
      - Do not fill required fields with guessed values, assumptions, or placeholders merely to
        preserve a schema. Only use them when the user explicitly permits that behavior; otherwise
        ask for the missing evidence, mark it unavailable, or disclose the limitation.
      - Do not turn a genre convention or evaluator-only preference into a mandatory runtime
        requirement when the user, an authoritative source, and the observable task schema do not
        require it. Keep unsupported additions optional or output no experience change.
      - Guard every mandatory output section, field, artifact, or language choice with the same
        explicit runtime requirement that justifies it. A related input concept, audience, locale,
        or genre does not by itself imply another required output element.
      - Treat user-provided assumptions, exclusions, and pre-handled topics as reasoning constraints.
        Do not require copying them into an introduction, scope section, or other visible output unless
        the runtime request explicitly asks for that restatement.
      - For fixed-capacity artifacts, do not resolve requirement conflicts by shrinking text or packing
        dense nested content. Preserve readability; use explicit priorities, surface the conflict, or
        request a scope/layout decision when all required content cannot fit.
      - Describe internal-process leakage semantically. Do not copy platform names, hidden
        directories, internal manifest filenames, or control metadata literals into the reusable
        runtime rule.
      - Keep the complete rendered experience compact (normally 140-320 English words or an
        equivalently concise amount in another language): no setup chatter, policy dumps, full
        paths, raw IDs, hidden answers, or repeated rules. Use semantic roles instead of case
        literals.
      - The rendered Experience must use only future-runtime language. Never mention evaluation
        criteria, rubric, evaluator, benchmark, score, request/case/execution IDs, or imply that
        the agent can observe those concepts during a real user task. Rewrite such evidence as the
        concrete source/output discrepancy visible in the trajectory, or output no change.
      - Use imperative, machine-readable bullets. No introductory or closing paragraphs.

    merge_op: patch

  - name: reminder
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.
      Write only the bullet body for `## Reminder`; the storage template adds the heading.
      - <one sentence root-cause lesson that changes the next agent behavior>
    merge_op: patch

  - name: procedure
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.
      Write only 2-5 ordered action steps for `## Procedure`; the storage template adds the heading.
      Each step must implement the same root-cause repair. Bind values from the future request,
      authoritative source, or observable tool result rather than copying source-case literals.
      1. At <earliest decision boundary>: <inspect and bind the decisive runtime evidence>.
      2. Before <material action or generation>: <apply the replacement decision rule>.
      3. If needed: <perform the smallest repair without disturbing already-correct work>.
    merge_op: patch

  - name: verification
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.
      Write only 2-5 bullets for `## Verification`; the storage template adds the heading.
      - State the expected business, data, content, or task relationship that must hold.
      - Verify it from authoritative input or an independently observable result. The generated
        output must not prove itself; successful save, conversion, or parser exit is not enough.
      - For saved artifacts, reopen, render, recalculate, or reparse the actual persisted artifact
        when that is the only reliable way to verify the result.
      - If the check fails, use the observed mismatch to identify the specific failed component,
        such as source-field mapping, unit conversion, calculation formula, cumulative dependency,
        state transition, or persisted output. Repair only that component and preserve already-correct
        work.
      - Repeat the same check with the same relevant inputs after repair, and state the observable
        relationship or result that must hold before the work is accepted. Do not use vague language
        such as "fix the formula" or "check again" without naming the repair target and recheck.
        Do not create an extra user deliverable unless the user requested one.
    merge_op: patch

  - name: fallback
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.
      Write 1-3 concise bullets for `## Fallback`; the storage template adds the heading.
      - Prefer a confirmed alternative path that still completes the requested task when the primary
        path fails. State the observable failure that triggers the switch, the confirmed alternative,
        the result or constraint that must remain unchanged, and how the alternative result is verified.
      - A fallback is confirmed only when it is supported by the observed trajectory, the user request,
        an authoritative source, or an explicit tool/runtime contract. A successful switch observed in
        the trajectory, such as tool A failing and compatible tool B completing the same result, may be
        recorded. Do not infer that an untried tool, source, format, or workflow will work.
      - If no supported alternative is known, write an empty string for this field rather than inventing
        one. Ask for missing evidence or disclose a limitation only when the runtime evidence clearly
        shows that user input or an external decision is required. Do not make a specific tool, helper
        filename, or extra artifact mandatory unless it is part of the runtime contract.
    merge_op: patch

  - name: anti_pattern
    type: string
    description: |
      Natural-language content must be written in {{ language }}. Keep tool names, schema
      fields, Python identifiers, and quoted runtime values unchanged.
      Write only the bullet body for `## Anti-pattern`; the storage template adds the heading.
      - Do not <the tempting wrong behavior that caused the failure>
      - Preserve <the nearest correct behavior/object/action that must not be blocked>
    merge_op: patch
